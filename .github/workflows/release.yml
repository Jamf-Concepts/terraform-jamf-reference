# Requires prod. Runs when someone publishes a release. Promotes the released
# commit to prod once a reviewer approves. A release names a commit on main, so
# prod receives a commit that dev has already applied.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  checks:
    name: Check the release
    if: vars.PROD_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag can point at any commit, including one on an unmerged branch.
      - name: Check the commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release $GITHUB_REF_NAME points at a commit that is not on main."
            exit 1
          fi

      - name: Check dev applied the commit
        run: |
          successes="$(gh run list --workflow deploy.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)"
          if [[ "$successes" -eq 0 ]]; then
            echo "::error::No successful Deploy run exists for this commit. Release a commit that dev has applied."
            exit 1
          fi

  # Shows what the release will change in prod, for the approver to read.
  prod-plan:
    name: Prod preview
    needs: checks
    uses: ./.github/workflows/terraform.yml
    with:
      environment: prod
      github_environment: prod-plan
    secrets: inherit

  # Waits for a required reviewer on the prod GitHub environment.
  prod:
    name: Prod
    needs: prod-plan
    uses: ./.github/workflows/terraform.yml
    with:
      environment: prod
      apply: true
    secrets: inherit
