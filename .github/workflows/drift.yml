# Runs every weekday morning. Plans each environment and raises an issue when
# dev no longer matches main, or prod no longer matches the latest release. It
# changes nothing in Jamf.

name: Drift detection

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  dev:
    name: Dev
    uses: ./.github/workflows/terraform.yml
    with:
      environment: dev
      report_drift: true
    secrets: inherit

  # Requires prod. Skipped until the PROD_ENABLED repository variable is true.
  # Prod should match the latest release, so the check plans that release.
  released:
    name: Find the latest release
    if: vars.PROD_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find.outputs.tag }}
    steps:
      - name: Find the latest release
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName || true)" >> "$GITHUB_OUTPUT"

  prod:
    name: Prod
    needs: released
    if: needs.released.outputs.tag != ''
    uses: ./.github/workflows/terraform.yml
    with:
      environment: prod
      github_environment: prod-plan
      ref: ${{ needs.released.outputs.tag }}
      report_drift: true
    secrets: inherit
