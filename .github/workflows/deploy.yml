# Runs on every merge to main and applies the merged commit to dev. Prod does
# not follow a merge. Publishing a release promotes a commit to prod. See
# release.yml.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dev:
    name: Dev
    uses: ./.github/workflows/terraform.yml
    with:
      environment: dev
      apply: true
    secrets: inherit
